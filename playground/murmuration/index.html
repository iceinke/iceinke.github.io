<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05080d"><title>涌现 · 无人指挥</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05080d}canvas{display:block;width:100%;height:100%;touch-action:none}body{overscroll-behavior:none}#controls{position:fixed;left:22px;bottom:22px;width:238px;padding:15px 16px;background:rgba(8,16,27,.88);border:1px solid rgba(168,201,218,.2);border-radius:12px;backdrop-filter:blur(18px);box-shadow:0 12px 48px #0005;color:#afc2d0;font:12px system-ui}.controls-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;letter-spacing:.06em}.control-actions{display:flex;gap:12px}#controls button{border:0;padding:0;background:none;color:#8aa4b7;cursor:pointer;font:11px system-ui}#controls button:hover{color:#dfedf3}.rule{display:grid;grid-template-columns:36px 1fr 38px;gap:10px;align-items:center;margin-top:14px}.rule input{width:100%;margin:0;accent-color:#8cdeeb;cursor:pointer}.rule output{text-align:right;color:#d0e1e9;font-variant-numeric:tabular-nums}#controls.collapsed .rule{display:none}#controls.collapsed .controls-head{margin:0}@media(max-width:600px){#controls{left:12px;bottom:12px;width:204px;padding:13px}.rule{gap:7px}}#controls.collapsed{width:auto;padding:10px 12px;border-radius:10px}#controls.collapsed .controls-head>span,#controls.collapsed #reset-strengths,#controls.collapsed #toggle-fluctuation{display:none}#controls.collapsed{opacity:0;pointer-events:none;transition:opacity .18s ease}#controls.collapsed.button-visible{opacity:1;pointer-events:auto}@media(hover:none){#controls.collapsed{opacity:1;pointer-events:auto}}:focus-visible{outline:2px solid #8cdeeb;outline-offset:4px}#fps{position:fixed;left:22px;top:22px;z-index:2;color:#8fa4b5;font:12px ui-monospace,monospace;font-variant-numeric:tabular-nums;pointer-events:none;text-shadow:0 1px 4px #0008}@media(max-width:600px){#fps{left:12px;top:12px}}#inspector{position:fixed;right:clamp(12px,1.5vmin,22px);top:clamp(12px,1.5vmin,22px);width:min(20vmin,288px);aspect-ratio:1;background:none;border:0;overflow:visible}#inspector[hidden]{display:none}#neighborhood{width:100%;height:100%;filter:drop-shadow(0 8px 16px #0007)}#close{position:absolute;right:0;top:0;width:28px;height:28px;padding:0;border:0;background:none;font:20px system-ui;color:#9fb5c5;cursor:pointer;text-shadow:0 1px 4px #000}#close:hover{color:#eff8ff} </style>
</head>
<body><div id="fps" aria-label="实际画面帧率">FPS —</div><canvas aria-label="深色背景中的银白鸟群，持续自由飞行"></canvas><aside id="inspector" hidden aria-label="选中鸟周围的实时放大视野"><canvas id="neighborhood" aria-label="主画面中选中鸟周围区域的实时放大画面"></canvas><button id="close" aria-label="关闭放大视野">×</button></aside><section id="controls" aria-label="鸟群规则强度"><div class="controls-head"><span>群体规则</span><div class="control-actions"><button id="toggle-fluctuation" aria-pressed="true" title="强度在滑块基准附近约 ±10% 缓慢浮动">浮动 开</button><button id="reset-strengths">重置</button><button id="toggle-controls" aria-label="收起规则控制" aria-expanded="true">收起</button></div></div><label class="rule"><span>分离</span><input id="strength-separation" type="range" min="0" max="4" step="0.05" value="1" aria-label="分离强度"><output id="value-separation" for="strength-separation">1.0×</output></label><label class="rule"><span>对齐</span><input id="strength-alignment" type="range" min="0" max="4" step="0.05" value="1" aria-label="对齐强度"><output id="value-alignment" for="strength-alignment">1.0×</output></label><label class="rule"><span>聚合</span><input id="strength-cohesion" type="range" min="0" max="4" step="0.05" value="1" aria-label="聚合强度"><output id="value-cohesion" for="strength-cohesion">1.0×</output></label></section><script src="flock.js"></script></body>
</html>
