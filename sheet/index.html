          <button class="score-btn score-modal-close" id="score-modal-close" type="button" aria-label="关闭" title="关闭">×</button>
        </header>
        <div class="score-viewer" id="score-viewer">
          <div class="score-main"><div class="score-main-image-wrap"><img id="score-main-image" alt="" draggable="false"></div></div>
          <div class="score-expanded" id="score-expanded"></div>
          <button class="score-btn score-arrow prev" id="score-prev" type="button" aria-label="上一页" title="上一页">‹</button>
          <button class="score-btn score-arrow next" id="score-next" type="button" aria-label="下一页" title="下一页">›</button>
          <div class="score-controls">
            <div class="score-control-group">
              <span class="score-page-indicator" id="score-page-indicator" aria-live="polite"></span>
            </div>
            <div class="score-control-group">
              <button class="score-btn" id="score-zoom-out" type="button" aria-label="缩小" title="缩小">−</button>
              <label class="score-zoom-field"><input class="score-zoom-value" id="score-zoom-value" type="number" min="50" max="300" step="10" value="100" inputmode="numeric" aria-label="缩放百分比">%</label>
              <button class="score-btn" id="score-zoom-in" type="button" aria-label="放大" title="放大">+</button>
            </div>
            <div class="score-control-group">
              <button class="score-btn" id="score-expand-all-btn" type="button" aria-label="全部铺展" title="全部铺展" aria-pressed="false">▦</button>
            </div>
          </div>
        </div>
      </div>
    </div>`;

  const grid = root.querySelector('#score-grid');
  const modal = root.querySelector('#score-modal');
  const title = root.querySelector('#score-modal-title');
  const mainImage = root.querySelector('#score-main-image');
  const indicator = root.querySelector('#score-page-indicator');
  const expanded = root.querySelector('#score-expanded');
  const viewer = root.querySelector('#score-viewer');
  const zoomValue = root.querySelector('#score-zoom-value');
  const expandButton = root.querySelector('#score-expand-all-btn');
  function loadBackPages(button) {
    button.querySelectorAll('.score-sheet-back img[data-src]').forEach(backImage => {
      backImage.src = backImage.dataset.src;
      delete backImage.dataset.src;
    });
  }
  const backPageObserver = 'IntersectionObserver' in window
    ? new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (!entry.isIntersecting) return;
          loadBackPages(entry.target);
          backPageObserver.unobserve(entry.target);
        });
      }, { rootMargin: '200px' })
    : null;

  scores.forEach((score, index) => {
    const item = document.createElement('div');
    item.className = 'score-item';
    const button = document.createElement('button');
    button.className = 'score-stack';
    button.type = 'button';
    button.setAttribute('aria-label', `打开 ${score.title}`);
    for (let page = score.pages; page >= 2; page--) {
      const back = document.createElement('span');
      back.className = `score-sheet-back back-${page - 1}`;
      const backImage = document.createElement('img');
      backImage.alt = '';
      backImage.decoding = 'async';
      backImage.fetchPriority = 'low';
      backImage.dataset.src = url(score, page);
      backImage.addEventListener('load', () => back.classList.add('loaded'));
      back.appendChild(backImage);
      button.appendChild(back);
    }
    if (score.pages > 1) {
      if (backPageObserver) backPageObserver.observe(button);
      else loadBackPages(button);
      button.addEventListener('pointerenter', () => loadBackPages(button), { once: true });
      button.addEventListener('focus', () => loadBackPages(button), { once: true });
    }
    const cover = document.createElement('span');
    cover.className = 'score-cover';
    const image = document.createElement('img');
    image.src = url(score, 1);
    image.alt = `${score.title} 封面`;
    image.loading = index < 4 ? 'eager' : 'lazy';
    image.decoding = 'async';
    cover.appendChild(image);
    const badge = document.createElement('span');
    badge.className = 'score-pages-badge';
    badge.textContent = `${score.pages} 页`;
    button.append(cover, badge);
    button.addEventListener('click', () => openScore(score));
    const name = document.createElement('div');
    name.className = 'score-title';
    name.textContent = score.title;
    item.append(button, name);
    if (score.info) {
      const meta = document.createElement('div');
      meta.className = 'score-meta';
      meta.textContent = score.info;
      item.appendChild(meta);
    }
    grid.appendChild(item);
  });

  function updateTransform() {
    mainImage.style.setProperty('--score-zoom', zoom);
    mainImage.style.setProperty('--score-x', `${offsetX}px`);
    mainImage.style.setProperty('--score-y', `${offsetY}px`);
    if (document.activeElement !== zoomValue) zoomValue.value = Math.round(zoom * 100);
  }
  function setZoom(value) {
    zoom = Math.min(3, Math.max(.5, value));
    if (zoom <= 1) { offsetX = 0; offsetY = 0; }
    updateTransform();
  }
  function resetZoom() {
    zoom = 1; offsetX = 0; offsetY = 0;
    updateTransform();
  }
  function setPage(page) {
    if (!activeScore) return;
    activePage = (page - 1 + activeScore.pages) % activeScore.pages + 1;
    mainImage.src = url(activeScore, activePage);
    mainImage.alt = `${activeScore.title} 第 ${activePage} 页`;
    indicator.textContent = `${activePage} / ${activeScore.pages}`;
    resetZoom();
    // 当前页加载后预取相邻页，避免快速翻页时等待。
    if (activeScore.pages > 1) {
      const next = activePage === activeScore.pages ? 1 : activePage + 1;
      const preload = new Image();
      preload.src = url(activeScore, next);
    }
  }
  function clearExpanded() {
    expanded.replaceChildren();
    expanded.classList.remove('active');
    viewer.classList.remove('expanded');
    expandButton.setAttribute('aria-pressed', 'false');
    expandButton.setAttribute('aria-label', '全部铺展');
    expandButton.title = '全部铺展';
    expandButton.textContent = '▦';
  }
  function openScore(score) {
    activeScore = score;
    lastFocused = document.activeElement;
    previousOverflow = document.body.style.overflow;
    title.textContent = score.title;
    clearExpanded();
    setPage(1);
    modal.classList.add('open');
    document.body.classList.add('sheet-modal-open');
    document.body.style.overflow = 'hidden';
    root.querySelector('#score-modal-close').focus();
  }
  function closeModal() {
    modal.classList.remove('open');
    document.body.classList.remove('sheet-modal-open');
    document.body.style.overflow = previousOverflow;
    mainImage.removeAttribute('src');
    clearExpanded();
    activeScore = null;
    if (lastFocused && lastFocused.focus) lastFocused.focus();
  }
  function expandPages() {
    if (!activeScore) return;
    expanded.replaceChildren();
    for (let page = 1; page <= activeScore.pages; page++) {
      const button = document.createElement('button');
      button.type = 'button';
      button.setAttribute('aria-label', `查看第 ${page} 页`);
      const image = document.createElement('img');
      image.src = url(activeScore, page);
      image.alt = `${activeScore.title} 第 ${page} 页`;
      image.loading = page === 1 ? 'eager' : 'lazy';
      image.decoding = 'async';
      button.appendChild(image);
      button.addEventListener('click', () => { clearExpanded(); setPage(page); });
      expanded.appendChild(button);
    }
    expanded.classList.add('active');
    viewer.classList.add('expanded');
    expandButton.setAttribute('aria-pressed', 'true');
    expandButton.setAttribute('aria-label', '分别展示');
    expandButton.title = '分别展示';
    expandButton.textContent = '▣';
  }
  root.querySelector('#score-prev').addEventListener('click', () => setPage(activePage - 1));
  root.querySelector('#score-next').addEventListener('click', () => setPage(activePage + 1));
  root.querySelector('#score-zoom-out').addEventListener('click', () => setZoom(zoom - .2));
  root.querySelector('#score-zoom-in').addEventListener('click', () => setZoom(zoom + .2));
  zoomValue.addEventListener('change', () => {
    const percent = Number(zoomValue.value);
    if (Number.isFinite(percent) && percent > 0) setZoom(percent / 100);
    zoomValue.value = Math.round(zoom * 100);
  });
  zoomValue.addEventListener('keydown', event => {
    if (event.key === 'Enter') zoomValue.blur();
    event.stopPropagation();
  });
  mainImage.addEventListener('dblclick', resetZoom);
  expandButton.addEventListener('click', () => {
    if (viewer.classList.contains('expanded')) clearExpanded();
    else expandPages();
  });
  root.querySelector('#score-modal-close').addEventListener('click', closeModal);
  modal.addEventListener('click', event => { if (event.target === modal) closeModal(); });
  mainImage.addEventListener('wheel', event => {
    event.preventDefault();
    setZoom(zoom + (event.deltaY > 0 ? -.08 : .08));
  }, { passive: false });
  mainImage.addEventListener('pointerdown', event => {
    if (zoom <= 1 || event.pointerType === 'touch') return;
    drag = { x: event.clientX, y: event.clientY };
    mainImage.setPointerCapture(event.pointerId);
    mainImage.classList.add('dragging');
  });
  mainImage.addEventListener('pointermove', event => {
    if (!drag) return;
    offsetX += event.clientX - drag.x;
    offsetY += event.clientY - drag.y;
    drag = { x: event.clientX, y: event.clientY };
    updateTransform();
  });
  function endDrag() { drag = null; mainImage.classList.remove('dragging'); }
  mainImage.addEventListener('pointerup', endDrag);
  mainImage.addEventListener('pointercancel', endDrag);
  mainImage.addEventListener('touchstart', event => {
    if (event.touches.length === 2) {
      pinchDistance = Math.hypot(event.touches[1].clientX - event.touches[0].clientX, event.touches[1].clientY - event.touches[0].clientY);
    } else if (event.touches.length === 1 && zoom > 1) {
      drag = { x: event.touches[0].clientX, y: event.touches[0].clientY };
    }
  }, { passive: true });
  mainImage.addEventListener('touchmove', event => {
    if (event.touches.length === 2) {
      event.preventDefault();
      const distance = Math.hypot(event.touches[1].clientX - event.touches[0].clientX, event.touches[1].clientY - event.touches[0].clientY);
      if (pinchDistance) setZoom(zoom * distance / pinchDistance);
      pinchDistance = distance;
    } else if (event.touches.length === 1 && drag && zoom > 1) {
      event.preventDefault();
      offsetX += event.touches[0].clientX - drag.x;
      offsetY += event.touches[0].clientY - drag.y;
      drag = { x: event.touches[0].clientX, y: event.touches[0].clientY };
      updateTransform();
    }
  }, { passive: false });
  mainImage.addEventListener('touchend', () => { drag = null; pinchDistance = 0; });
  document.addEventListener('keydown', event => {
    if (!modal.classList.contains('open')) return;
    if (event.target === zoomValue) return;
    if (event.key === 'Escape') closeModal();
    else if (event.key === 'ArrowLeft') { event.preventDefault(); setPage(activePage - 1); }
    else if (event.key === 'ArrowRight') { event.preventDefault(); setPage(activePage + 1); }
    else if (event.key === '+' || event.key === '=') setZoom(zoom + .2);
    else if (event.key === '-') setZoom(zoom - .2);
  });
})();
</script>
